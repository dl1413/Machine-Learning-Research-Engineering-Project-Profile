name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project inventory and links
        run: python scripts/validate_portfolio.py
