[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-ts-benchmark"
version = "0.1.1"
description = "Auditable synthetic time-series tool-agent benchmark"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]

[project.scripts]
tsbench = "tsbench.cli:main"

[tool.setuptools.packages.find]
include = ["tsbench*"]
